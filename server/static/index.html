<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Grid</title>
    <style>
        body {
            margin: 10px;
            min-width: 320px; /* Ensure minimum width for mobile devices */
            background-color: rgb(44, 34, 77);
        }
        #flexCenter {
            min-width: 650px;
            display: flex;
            justify-content: center;
        }
        #rowCounter {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
        }
        #userCounter {
            position: fixed;
            top: 40px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
        }
        #content {
            margin: 0;
            min-width: calc(var(--checkboxWidth) * 20); /* Ensure it covers the checkboxes */
            background-color: beige;
            padding: 20px;
            border-radius: 10px;
        }
        #clipper {
            overflow: hidden;
            width: calc(var(--checkboxWidth) * 20);
            padding: 0;
            margin: 0;
        }
        .row {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 19px;
            overflow: hidden;
            text-overflow: clip;
        }
        /* input[type="checkbox"] {
            padding: 0;
            margin: 2px;
        } */

        #mover {
            transform: translate3d(0,calc((var(--offsetRows)) * var(--row-height)),0);
            /* transform: translate3d(0,var(--directTranslate),0); */
            position: sticky;
            top: 0px;
            padding: 0;
            margin: 0;
        }

        #filler {
            height: calc(var(--row-height) * var(--total-rows));
            padding: 0;
            margin: 0;
        }

        :root {
            --row-height: 19px;
            --offsetRows: 0;
            --checkboxWidth: 20px;
            --total-rows: 0;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            font-size: 24px;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Loading...</div>
    </div>
    <div id="rowCounter">Rows Scrolled: 0</div>
    <div id="userCounter">Active Users: 0</div>
    <div id="flexCenter">
        <div id="content">
            <div id="clipper">
                <div id="mover">
                    <!-- {{checkbox}} -->
                </div>
                <div id="filler"></div>
            </div>
        </div>
    </div>
    <script>
        const DEBUG = false; // Toggle this for production

        function log(...args) {
            if (DEBUG) {
                console.log(...args);
            }
        }

        var rowsScrolled = 0;
        var totalRows = 1;
        // move the ckeckboxes down with the viewport and update a variable with the number of rows scrolled past the first row
        window.onscroll = function() {
            while (!loaded) {
                // Sleep 10ms and try again
                setTimeout(() => {}, 10);
            }
            var rows = document.getElementsByClassName("row");
            var row = rows[0];
            var rowHeight = row.offsetHeight;
            var rowTop = 0;
            var currentElement = row;
            while (currentElement !== document.body) {
                rowTop += currentElement.offsetTop;
                currentElement = currentElement.offsetParent;
            }
            // console.log(rowTop);
            var rowBottom = rowTop + rowHeight;
            rowsScrolled = Math.max(0, Math.floor((window.scrollY - rowTop) / rowHeight));
            // Calculate maximum possible row
            var maxPossibleRow = Math.max(0, Math.ceil(boardSize / 20) - totalRows);
            // Ensure rowsScrolled doesn't exceed maximum possible row
            rowsScrolled = Math.min(rowsScrolled, maxPossibleRow);
            // Special handling for bottom rows to prevent glitching
            if (rowsScrolled >= maxPossibleRow - 1) {
                // Lock to the exact bottom position
                rowsScrolled = maxPossibleRow;
            }
            // set offsetRows in css
            document.documentElement.style.setProperty("--offsetRows", rowsScrolled);
            // set the top row position
            // document.documentElement.style.setProperty("--topRowPos", rowTop + "px");
            // set the counter
            updateCheckBoxes();
            updateRowCounter(); // Update the row counter on scroll
        }

        // window.onscroll = function() {
        //     // use getBoundingClientRect to get the position of the first row relative to the viewport
        //     // then we can translate it down with css so that it stays at the top of the viewport
        //     // TODO maybe later try sticky element
        //     var mover = document.getElementById("mover");

        //     var offTop = mover.getBoundingClientRect().top;

        //     console.log(offTop);
            

        //     document.documentElement.style.setProperty("--directTranslate", offTop + "px");

        // }

        // Update the checkboxwidth in the css
        var loaded = false;
        window.onload = function() {
            fillWithBoxes();

            // Fill in css vars
            var checkbox0 = document.getElementById("checkbox0");
            var chackbox1 = document.getElementById("checkbox1");
            var checkbox0Pos = checkbox0.getBoundingClientRect();
            var checkbox1Pos = chackbox1.getBoundingClientRect();
            var checkboxWidth = checkbox1Pos.left - checkbox0Pos.left;
            document.documentElement.style.setProperty("--checkboxWidth", checkboxWidth + "px");
            
            // Start fetching settings and opening WebSocket in parallel
            Promise.all([
                fetchSettings(),
                new Promise(resolve => {
                    // Start WebSocket connection right away
                    openWebsocket(() => resolve(true));
                })
            ]).then(() => {
                // Hide loading overlay when both are complete
                document.getElementById('loadingOverlay').style.display = 'none';
                loaded = true;
            }).catch(err => {
                console.error("Error during initialization:", err);
                document.getElementById('loadingText').innerText = 'Error loading. Try refreshing.';
            });
        }
        window.onresize = function() {
            fillWithBoxes();
            updateCheckBoxes(); // Add this line to restore checkbox states after resize
        }

        function fillWithBoxes() {
            generateDomBoxes(1);
            // Find the height of the row and the height of the viewport
            var row = document.getElementById("row0");
            var rowHeight = row.offsetHeight;
            var viewportHeight = window.innerHeight;
            // Find the number of rows that fit in the viewport
            totalRows = Math.ceil(viewportHeight / rowHeight);
            // Redo it with the right number of rows
            generateDomBoxes(totalRows);
        }

        function generateDomBoxes(rows) {
            // Generate checkboxes
            const rowLength = 20;
            var checkboxes = "";
            for (let j = 0; j < rows; j++) {
                checkboxes += `<div id="row${j}" class="row" >`;
                for (let i = 0; i < rowLength; i++) {
                    let inx = 20 * j + i;
                    checkboxes += `
                        <input type="checkbox" id="checkbox${inx}" name="checkbox${inx}" onclick="handleBox(${inx})"></input>
                    `;
                }
                checkboxes += "</div>";
            }
            document.getElementById("mover").innerHTML = checkboxes;
        }

        // store the boolean state of all checkboxes (size will be set when connecting)
        var checkStates = [];
        var boardSize = 0;

        // Fetch settings before connecting to WebSocket
        async function fetchSettings() {
            document.getElementById('loadingText').innerText = 'Loading settings...';
            try {
                const response = await fetch('settings.json');
                const settings = await response.json();
                if (settings && settings.boardSize) {
                    boardSize = settings.boardSize;
                    checkStates = new Array(boardSize).fill(false);
                    
                    // Calculate exact number of rows needed for the entire board
                    const exactRows = Math.ceil(boardSize / 20);
                    
                    // Update total rows for filler with exact value
                    document.documentElement.style.setProperty("--total-rows", exactRows);
                    log("Board size set from settings:", boardSize, "Rows:", exactRows);
                    return true;
                }
                alert("Error: Invalid settings.json file (missing boardSize)");
                return false;
            } catch (error) {
                log("Error fetching settings:", error);
                alert("Error loading settings.json. The application may not work correctly.");
                return false;
            }
        }

        // handle updating the checkBoxes in the dom when the user scrolls
        function updateCheckBoxes() {
            // Get the exact row count left in the board from current position
            const remainingBoxes = Math.max(0, boardSize - (rowsScrolled * 20));
            const visibleBoxes = Math.min(totalRows * 20, remainingBoxes);
            
            for (var i = 0; i < totalRows * 20; i++) {
                var globalIndex = i + rowsScrolled * 20;
                var box = document.getElementById(`checkbox${i}`);
                
                if (!box) continue;
                
                // If we're beyond the board size, hide or disable the checkbox
                if (globalIndex >= boardSize) {
                    box.disabled = true;
                    box.style.visibility = "hidden";
                } else {
                    box.disabled = false;
                    box.style.visibility = "visible";
                    box.checked = checkStates[globalIndex];
                }
            }
        }

        function updateRowCounter() {
            document.getElementById("rowCounter").textContent = `Rows Scrolled: ${rowsScrolled}`;
        }

        function getWsUrl() {
            var proto = window.location.protocol
            var wsproto = proto === "https:" ? "wss:" : "ws:";
            var wsurl = wsproto + "//" + window.location.host + "/ws";
            return wsurl;
        }
        // const wsurl = "wss://publdev.abad.cc/ws";
        // const wsurl = "ws://localhost:1335/ws";
        // const wsurl = "ws://baredev.abad.cc/ws";
        var wsurl = getWsUrl();

        var ws = null;
        var messageQueue = JSON.parse(localStorage.getItem("messageQueue")) || [];

        function saveMessageQueue() {
            localStorage.setItem("messageQueue", JSON.stringify(messageQueue));
        }

        window.addEventListener("beforeunload", function() {
            saveMessageQueue();
        });
        // retry should be a callback function to rerun after the websocket is opened
        // Variables for active user tracking
        var activeUsers = 0;
        var lastHeartbeat = Date.now();
        
        // Modified to accept a callback for when the connection is established
        function openWebsocket(callback) {
            log("Opening websocket");
            document.getElementById('loadingText').innerText = 'Connecting to server...';
            
            if (ws === null || ws.readyState === 3) {
                ws = new WebSocket(wsurl);
                ws.binaryType = "arraybuffer";
                ws.onopen = function() {
                    log("Websocket opened");
                    document.getElementById('loadingText').innerText = 'Connected, receiving data...';
                    sendMessages(); // Send any queued messages immediately
                    // Start heartbeat
                    startHeartbeat();
                    if (callback) callback();
                }
                ws.onmessage = function(event) {
                    const data = new Uint8Array(event.data);
                    
                    if (data[0] === 1) { // board size message - ignore, we already have it from settings
                        // No need to process - we already have board size from settings.json
                        log("Received board size message from server:", 
                            (data[1] << 24) | (data[2] << 16) | (data[3] << 8) | data[4]);
                    } else if (data[0] === 0) { // checkbox change from another client
                        const id = (data[1] << 16) | (data[2] << 8) | data[3];
                        const state = data[4] !== 0;
                        if (id < boardSize) {
                            checkStates[id] = state;
                            updateCheckBoxes();
                            log("Received forwarded change:", { id, state });
                        }
                    } else if (data[0] === 2) { // active user count message
                        // Extract user count from bytes 1-4
                        activeUsers = (data[1] << 24) | (data[2] << 16) | (data[3] << 8) | data[4];
                        updateUserCounter();
                        log("Received active user count:", activeUsers);
                        // Reset heartbeat timestamp
                        lastHeartbeat = Date.now();
                    } else if (data[0] === 3) { // heartbeat ping
                        // Send heartbeat response
                        const heartbeatResponse = new Uint8Array([4]); // Type 4 = heartbeat response
                        if (ws.readyState === 1) {
                            ws.send(heartbeatResponse);
                        }
                        log("Received and responded to heartbeat");
                    } else { // full board state
                        document.getElementById('loadingText').innerText = 'Processing board state...';
                        
                        // Process board state in chunks for better performance
                        setTimeout(() => {
                            const chunkSize = 5000; // Process 5000 bytes at a time
                            let i = 0;
                            
                            function processNextChunk() {
                                const endIndex = Math.min(i + chunkSize, data.length);
                                for (; i < endIndex; i++) {
                                    for (let j = 0; j < 8; j++) {
                                        const inx = i*8 + j;
                                        if (inx < boardSize) {
                                            checkStates[inx] = (data[i] & (1 << (7 - j))) !== 0;
                                        }
                                    }
                                }
                                
                                // If we processed less than the whole chunk, we're done
                                if (i < data.length) {
                                    document.getElementById('loadingText').innerText = 
                                        `Processing board state... ${Math.floor((i / data.length) * 100)}%`;
                                    setTimeout(processNextChunk, 0);
                                } else {
                                    updateCheckBoxes();
                                    log("Received full board update");
                                }
                            }
                            
                            processNextChunk();
                        }, 0);
                    }
                }
                ws.onclose = function() {
                    log("Websocket closed");
                    setTimeout(() => openWebsocket(), 1000);
                }
                ws.onerror = function(error) {
                    log("WebSocket error:", error);
                    document.getElementById('loadingText').innerText = 'Connection error, retrying...';
                }
            } else if (ws.readyState === 0) {
                log("Websocket not open yet");
                if (callback) setTimeout(callback, 500);
            } else if (ws.readyState === 1) {
                log("Websocket already open");
                if (callback) callback();
            }
        }

        function updateUserCounter() {
            document.getElementById("userCounter").textContent = `Active Users: ${activeUsers}`;
        }
        
        function startHeartbeat() {
            // Check every 30 seconds if we've received a heartbeat in the last minute
            setInterval(function() {
                const now = Date.now();
                if (now - lastHeartbeat > 60000) { // If no heartbeat for 60 seconds
                    log("No heartbeat received for 60 seconds, reconnecting...");
                    if (ws) {
                        ws.close();
                    }
                }
            }, 30000);
        }

        function sendMessages() {
            if (ws.readyState === 1) {
                while (messageQueue.length > 0) {
                    var message = messageQueue.shift();
                    // Convert to binary message: type (1) + index (3 bytes) + state (1)
                    var bytes = new Uint8Array(5);
                    bytes[0] = 0; // type 0 = checkbox change
                    bytes[1] = (message.id >> 16) & 0xFF;
                    bytes[2] = (message.id >> 8) & 0xFF;
                    bytes[3] = message.id & 0xFF;
                    bytes[4] = message.state ? 1 : 0;
                    ws.send(bytes);
                }
            }
        }

        function handleBox(id) {
            var box = document.getElementById(`checkbox${id}`);
            var inx = id + rowsScrolled*20;
            // Prevent accessing beyond array bounds
            if (inx >= boardSize) {
                return;
            }
            checkStates[inx] = box.checked;
            // Send the state of the checkbox to the server
            messageQueue.push({id: inx, state: box.checked});
            
            sendMessages();

            log("Set box", id, "To", box.checked, "from index", inx);
        }
    </script>
</body>
</html>
